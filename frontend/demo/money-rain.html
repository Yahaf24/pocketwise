<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketWise – הדגמת גשם כסף</title>
<style>
  :root {
    --bg: #F6F5EF; --surface: #FFFDF8; --line: #DCE0D8; --ink: #13213A; --muted: #4A5568;
    --accent: #1F6B57; --accent-soft: #E2F0EA; --idle-soft: #E4E8EF;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101A2C; --surface: #17243A; --line: #2A3A55; --ink: #EEF1F6; --muted: #B4C0D3;
            --accent: #7FD1B9; --accent-soft: #1C3D36; --idle-soft: #25324A; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Nunito Sans", Arial, sans-serif;
         font-size: 16px; line-height: 1.5; padding: 32px max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
  h1 { font-family: Rubik, Arial, sans-serif; font-size: 26px; margin: 0; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px;
          display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .pill { font-weight: 700; font-size: 14px; padding: 6px 14px; border-radius: 999px; background: var(--idle-soft); }
  .pill.done { background: var(--accent-soft); color: var(--accent); }
  button { font: 600 16px "Nunito Sans", Arial, sans-serif; border-radius: 999px; padding: 10px 20px; min-height: 44px;
           cursor: pointer; border: 2px solid var(--accent); }
  .primary { background: var(--accent); color: var(--surface); }
  .secondary { background: transparent; color: var(--accent); }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .seg { display: inline-flex; gap: 6px; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
  .seg button[aria-pressed="false"] { background: transparent; color: var(--accent); }
  #message { font-weight: 700; color: var(--accent); min-height: 1.5em; }
</style>
</head>
<body>
<main>
  <div>
    <h1>הדגמה: גשם כסף כשמגיעים ליעד</h1>
    <p class="muted">דף הדגמה של הפיצ'ר בלבד. אין כאן חישובים או סכומים אמיתיים.</p>
  </div>

  <div class="card">
    <div class="row">
      <span>סימן להצגה</span>
      <div class="seg" role="group" aria-label="סימן להצגה">
        <button type="button" id="cur-ils" data-cur="ILS" aria-pressed="true">₪</button>
        <button type="button" id="cur-usd" data-cur="USD" aria-pressed="false">$</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <strong>היעד: מחשב נייד</strong>
      <span class="pill" id="status">בדרך ליעד</span>
    </div>
    <p id="message" role="status" aria-live="polite"></p>
    <div class="row">
      <button type="button" class="primary" id="finish">הוספת ההפקדה האחרונה</button>
      <button type="button" class="secondary" id="reset">איפוס ההדגמה</button>
    </div>
    <p class="muted">הגשם יורד רק ברגע שהיעד הושג. לחיצה נוספת כשהיעד כבר הושג לא מפעילה אותו שוב.</p>
  </div>
</main>

<script type="module">
  import { moneyRain, shouldCelebrate } from "../js/money-rain.js";

  let currency = "ILS";
  let status = "feasible";
  const statusEl = document.getElementById("status");
  const messageEl = document.getElementById("message");

  document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
    currency = b.dataset.cur;
    document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));

  function setStatus(next) {
    const previous = status;
    status = next;
    const achieved = next === "already_achieved";
    statusEl.textContent = achieved ? "היעד הושג" : "בדרך ליעד";
    statusEl.classList.toggle("done", achieved);
    if (shouldCelebrate(previous, next)) {
      messageEl.textContent = "כל הכבוד! הגעת ליעד החיסכון שלך.";
      moneyRain({ currency });
    }
  }

  document.getElementById("finish").addEventListener("click", () => setStatus("already_achieved"));
  document.getElementById("reset").addEventListener("click", () => { messageEl.textContent = ""; setStatus("feasible"); });
</script>
</body>
</html>
