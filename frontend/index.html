<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PocketWise</title>
<style>
  :root { --bg: #F6F5EF; --surface: #FFFDF8; --line: #DCE0D8; --ink: #13213A; --muted: #4A5568; --accent: #1F6B57; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101A2C; --surface: #17243A; --line: #2A3A55; --ink: #EEF1F6; --muted: #B4C0D3; --accent: #7FD1B9; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Nunito Sans", Arial, sans-serif;
         line-height: 1.5; padding: 32px max(16px, env(safe-area-inset-left, 0px)); }
  main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  h1 { font-family: Rubik, Arial, sans-serif; margin: 0; }
  p { margin: 0; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 18px;
      color: var(--accent); font-weight: 700; text-decoration: none; }
  a:hover, a:focus-visible { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>PocketWise</h1>
  <p>מתכנן תקציב ויעד חיסכון לסטודנטים. האפליקציה עצמה עדיין בבנייה; כאן אפשר לנסות את ההדגמות.</p>
  <ul>
    <li><a href="demo/money-rain.html">הדגמה: גשם כסף כשמגיעים ליעד</a></li>
  </ul>
</main>
</body>
</html>
